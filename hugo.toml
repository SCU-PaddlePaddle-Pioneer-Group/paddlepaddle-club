baseURL = 'https://example.github.io/paddlepaddle-club/'
languageCode = 'zh-cn'
title = 'PADDLEPADDLE CLUB'
defaultContentLanguage = 'zh'
enableRobotsTXT = true

[params]
  description = 'PaddlePaddle Club · 用技术连接想法，用开源推动成长。'
  author = 'PaddlePaddle Club'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# home 同时输出 HTML 与 JSON（供 nav.js 读取帖子数据）
[outputs]
  home = ["html", "json"]

[outputFormats]
  [outputFormats.json]
    mediaType = "application/json"
    isPlainText = true
    baseName = "index"

